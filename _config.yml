# GitHub Pages / Minimal Mistakes site configuration
title: Ka Wing
subtitle: "Human-Robot Interaction Researcher | Ergonomics Designer | Community Advocate"
description: "Multidisciplinary researcher and designer bridging human-centered technology and social impact."

url: "https://tsang-research.github.io"
baseurl: ""
repository: "tsang-research/tsang-research.github.io"

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"

# Presentation
search: false
breadcrumbs: false
words_per_minute: 200
timezone: "Etc/UTC"

# Build settings
markdown: kramdown
highlighter: rouge

include:
  - _pages

exclude:
  - preview.html
  - Gemfile
  - README.md
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - node_modules

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-remote-theme

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      share: false
      related: false
      read_time: false
      comments: false

# Replace these contact placeholders before publishing.
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:kawing-sd.tsang@connect.polyu.hk"
    - label: "AEDLAB"
      icon: "fab fa-fw fa-Website"
      url: "https://www.sd.polyu.edu.hk/aedlab/#:~:text=Asian%20Ergonomics%20Design%20Laboratory%20(AEDLAB),in%20the%20field%20of%20design."
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=YOUR_SCHOLAR_ID"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-GM5JCGXN59"
    anonymize_ip: false

    logo: /assets/img/logo.svg
